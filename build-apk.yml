name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          # Définir dans GitHub: Settings > Secrets and variables > Actions > Variables
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RihlaSahara.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RihlaSahara-apk
          path: frontend/RihlaSahara.apk
